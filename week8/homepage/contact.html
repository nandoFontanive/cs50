<html>
<header class="container text-center py-4">
    <h1>Contact</h1>
    <p>Get in touch here</p>
</header>

<nav class="navbar navbar-expand bg-primary">
    <div class="container justify-content-center">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Start</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>

            <li class="nav-item"><a class="nav-link text-white" href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<main class="container mt-5 text-center">
    <h2>Send a Message</h2>

    <form class="mx-auto mt-4" style="max-width: 400px;" onsubmit="send(event)">
        <input class="form-control mb-3" type="text" placeholder="Your name" required>
        <input class="form-control mb-3" type="email" placeholder="Your email" required>
        <textarea class="form-control mb-3" placeholder="Message" required></textarea>
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</main>

<footer class="text-center mt-5 p-3">
    <p>My website</p>
</footer>

<script>
    function send(event) {
        event.preventDefault();
        alert("Message sent!");
    }
</script>
</html>
